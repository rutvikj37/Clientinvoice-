# Local MySQL for development. Production uses the existing VPS MySQL instance.
#   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: clientinvoice-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: clientinvoice
      MYSQL_USER: clientinvoice
      MYSQL_PASSWORD: clientinvoice
    volumes:
      - clientinvoice_mysql_data:/var/lib/mysql
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-prootpass']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  clientinvoice_mysql_data:
